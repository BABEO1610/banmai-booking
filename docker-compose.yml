services:
  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file:
      - ./server/.env
    environment:
      # The host .env may contain a Windows certificate path; use the path inside the image.
      DATABASE_SSL_CA_PATH: /app/server/certs/supabase-ca.pem
    expose:
      - "3000"
    volumes:
      - banmai-media:/app/server/.data/media
    restart: unless-stopped
    init: true

  web:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

volumes:
  banmai-media:
